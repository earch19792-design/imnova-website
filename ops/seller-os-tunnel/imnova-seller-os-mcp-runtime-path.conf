[Service]
# The OpenAI Secure MCP Tunnel runs from a clean, immutable Git worktree.
# This keeps the historical integration checkout and its local changes intact.
WorkingDirectory=%h/imnova-seller-os-tunnel-runtime
EnvironmentFile=%h/.config/imnova/seller-os-tunnel-local-boundary.env
Environment=EBAY_PRO_RUNTIME=staging
Environment=LOCAL_VM_LAB_ENABLED=false
Environment=SELLER_OS_PUBLIC_ORIGIN=https://selleros.sunshineecommerce-llc.com
Environment=SELLER_OS_DEPLOYMENT_MODE=selfhost
