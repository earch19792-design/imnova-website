name: imnova-selfhost

services:
  web:
    image: imnova-selfhost-web:local
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - app_env
    env_file:
      - path: ${SELFHOST_ENV_FILE:-.env.selfhost.production}
        required: true
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # A local container must never inherit Vercel workload identity.
      VERCEL: ""
      VERCEL_ENV: ""
      VERCEL_TARGET_ENV: ""
      VERCEL_URL: ""
      VERCEL_BRANCH_URL: ""
      VERCEL_PROJECT_ID: ""
      VERCEL_PROJECT_PRODUCTION_URL: ""
      VERCEL_OIDC_TOKEN: ""
      EBAY_PRO_RUNTIME: "${EBAY_PRO_RUNTIME:-staging}"
      SELLER_OS_DEPLOYMENT_MODE: "${SELLER_OS_DEPLOYMENT_MODE:-selfhost}"
      SELLER_OS_PUBLIC_ORIGIN: "${SELLER_OS_PUBLIC_ORIGIN:-}"
      LOCAL_VM_LAB_ENABLED: "${LOCAL_VM_LAB_ENABLED:-false}"
      LOCAL_VM_LAB_DRY_RUN: "${LOCAL_VM_LAB_DRY_RUN:-false}"
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SELFHOST_HTTP_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/').then((response) => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 4

  scheduler:
    image: imnova-selfhost-web:local
    profiles:
      - automation
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - path: ${SELFHOST_ENV_FILE:-.env.selfhost.production}
        required: true
    environment:
      LOCAL_SCHEDULER_ORIGIN: http://web:3000
      LOCAL_SCHEDULER_DRY_RUN: "${LOCAL_SCHEDULER_DRY_RUN:-true}"
      VERCEL: ""
      VERCEL_ENV: ""
      VERCEL_TARGET_ENV: ""
      VERCEL_URL: ""
      VERCEL_BRANCH_URL: ""
      VERCEL_PROJECT_ID: ""
      VERCEL_PROJECT_PRODUCTION_URL: ""
      VERCEL_OIDC_TOKEN: ""
      EBAY_PRO_RUNTIME: "${EBAY_PRO_RUNTIME:-staging}"
      SELLER_OS_DEPLOYMENT_MODE: "${SELLER_OS_DEPLOYMENT_MODE:-selfhost}"
      SELLER_OS_PUBLIC_ORIGIN: "${SELLER_OS_PUBLIC_ORIGIN:-}"
      LOCAL_VM_LAB_ENABLED: "${LOCAL_VM_LAB_ENABLED:-false}"
      LOCAL_VM_LAB_DRY_RUN: "${LOCAL_VM_LAB_DRY_RUN:-false}"
    command: ["node", "tools/selfhost-scheduler.mjs"]
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

  tunnel:
    image: cloudflare/cloudflared:2026.10.0
    profiles:
      - public
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CLOUDFLARED_CONFIG_DIR:-./.cloudflared}
        target: /etc/cloudflared
        read_only: true
    command:
      [
        "tunnel",
        "--config",
        "/etc/cloudflared/config.yml",
        "--no-autoupdate",
        "--loglevel",
        "info",
        "run",
      ]
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 256m
    cpus: 0.5

secrets:
  app_env:
    file: ${SELFHOST_ENV_FILE:-.env.selfhost.production}
