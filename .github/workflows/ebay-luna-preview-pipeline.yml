name: eBay Luna Preview discovery pipeline

on:
  # GitHub only evaluates scheduled workflows from the default branch.
  # workflow_dispatch remains available for an explicitly selected revision.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebay-luna-preview-discovery-pipeline
  cancel-in-progress: false

jobs:
  refresh-and-scan:
    # Preview/staging only. The two server routes remain independently
    # authenticated and all notification/eBay mutation flags stay fail-closed.
    if: >-
      vars.EBAY_LUNA_PREVIEW_PIPELINE_ENABLED == 'true' &&
      vars.LUNA_MARKET_RADAR_NOTIFICATION_DISPATCH_ENABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PREVIEW_URL: ${{ secrets.EBAY_COMMERCIAL_PREVIEW_URL }}
      CRON_SECRET: ${{ secrets.EBAY_COMMERCIAL_CRON_SECRET }}
      VERCEL_BYPASS_SECRET: ${{ secrets.EBAY_COMMERCIAL_VERCEL_BYPASS_SECRET }}
      MAX_WINDOWS_CONFIG: ${{ vars.EBAY_LUNA_PREVIEW_MAX_WINDOWS }}
    steps:
      - name: Validate Preview authorization contract
        shell: bash
        run: |
          test -n "$PREVIEW_URL"
          test -n "$CRON_SECRET"
          case "${PREVIEW_URL%/}" in
            https://imnova-ebay-mobile-preprod.vercel.app) ;;
            *)
              echo "PREVIEW_URL must target the authorized preproduction alias" >&2
              exit 1
              ;;
          esac

      - name: Refresh Luna catalog and inventory evidence
        id: luna
        shell: bash
        run: |
          args=(--fail --silent --show-error --max-time 50
            -H "Authorization: Bearer $CRON_SECRET")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET")
          fi
          max_windows="${MAX_WINDOWS_CONFIG:-8}"
          if ! [[ "$max_windows" =~ ^[0-9]+$ ]]; then
            max_windows=8
          fi
          if (( max_windows < 1 )); then
            max_windows=1
          elif (( max_windows > 12 )); then
            max_windows=12
          fi
          # Reserve enough of the bounded job timeout for the eBay read-only
          # scan when, and only when, Luna reaches COMPLETE.
          luna_deadline_seconds=$((SECONDS + 570))
          complete=false
          final_status=PARTIAL
          for ((window = 1; window <= max_windows; window += 1)); do
            if (( luna_deadline_seconds - SECONDS < 55 )); then
              echo "Luna workflow budget reached; checkpoint will resume next execution."
              break
            fi
            response_file="$(mktemp)"
            http_code="$(
              curl "${args[@]}" \
                --output "$response_file" \
                --write-out '%{http_code}' \
                "${PREVIEW_URL%/}/api/cron/market-radar-luna-sync?mode=readonly"
            )"
            scan_status="$(jq -r '.sync.scanStatus // "UNKNOWN"' "$response_file")"
            continuation="$(jq -r '.sync.continuationRequired // false' "$response_file")"
            rm -f "$response_file"
            echo "Luna window ${window}: HTTP ${http_code}, status ${scan_status}"
            final_status="$scan_status"
            if [ "$scan_status" = "COMPLETE" ]; then
              complete=true
              break
            fi
            if [ "$continuation" != "true" ]; then
              break
            fi
            sleep 2
          done
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [ "$complete" != "true" ]; then
            echo "Luna status ${final_status}: safely resumable; opportunity scan deferred."
          fi

      - name: Scan refreshed Luna opportunities against eBay read models
        if: steps.luna.outputs.complete == 'true'
        shell: bash
        run: |
          args=(--fail --silent --show-error --max-time 55
            --output /dev/null
            --write-out 'Opportunity scan HTTP %{http_code}\n'
            -H "Authorization: Bearer $CRON_SECRET")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET")
          fi
          curl "${args[@]}" "${PREVIEW_URL%/}/api/cron/ebay-luna-opportunity-scan"
