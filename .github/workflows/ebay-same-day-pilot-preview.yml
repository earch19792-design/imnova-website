name: Seller OS same-day pilot Preview worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ebay-same-day-pilot-preview-worker
  cancel-in-progress: false

jobs:
  same-day-worker:
    if: vars.EBAY_SAME_DAY_PILOT_PREVIEW_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Process one durable staging checkpoint
        env:
          PREVIEW_URL: ${{ secrets.EBAY_SAME_DAY_PILOT_PREVIEW_URL }}
          CRON_SECRET: ${{ secrets.EBAY_SAME_DAY_PILOT_CRON_SECRET }}
          VERCEL_BYPASS_SECRET: ${{ secrets.EBAY_SAME_DAY_PILOT_VERCEL_BYPASS_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test -n "$PREVIEW_URL"
          test -n "$CRON_SECRET"
          args=(--fail --silent --show-error --max-time 240
            -H "x-ebay-same-day-authorization: Bearer $CRON_SECRET")
          if [ -n "$VERCEL_BYPASS_SECRET" ]; then
            args+=(-H "x-vercel-protection-bypass: $VERCEL_BYPASS_SECRET")
          fi
          endpoint="$PREVIEW_URL/api/cron/ebay-same-day-pilot"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            endpoint="$endpoint?mode=validate"
          fi
          curl "${args[@]}" "$endpoint"
