name: Seller OS safety

on:
  pull_request:
    branches:
      - staging/ebay-pro-seller-os
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seller-os:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: "--max-old-space-size=6144"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reproducible install
        run: npm ci

      - name: Full Seller OS validation with durable subject
        run: npm run record:seller-os-validation

      - name: Whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"

      - name: Keep validation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seller-os-validation-${{ github.sha }}
          path: .seller-os/validation-evidence-v1.json
          if-no-files-found: error
